name: universe-anime-planet

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Тюнинг под 2GB RAM сервера — держим shared_buffers/work_mem скромными.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=192MB"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "max_connections=40"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 640m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./assets/cards:/app/assets/cards:ro
      # Без этого монтирования alembic revision --autogenerate, запущенный внутри
      # контейнера, пишет файл миграции только в его временный слой — тот удаляется
      # вместе с контейнером (--rm), и следующий `docker compose run` снова видит
      # пустую migrations/versions/. С bind-mount файл сразу оказывается на хосте.
      - ./migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m

  # Mini App (см. TODO, Этап 12) — тот же образ, что и bot (тот же src/, requirements.txt
  # уже включает fastapi/uvicorn), просто другая команда запуска. Read-only: не пишет в БД.
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 192m

  # Собирает фронтенд (Vite) и отдаёт его + картинки карточек + проксирует /api — см.
  # Dockerfile.web, Caddyfile. Нужен DOMAIN в .env (иначе просто не поднимайте этот сервис:
  # `docker compose up -d postgres redis bot api`, без caddy).
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./assets/cards:/srv/cards:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    mem_limit: 128m

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
